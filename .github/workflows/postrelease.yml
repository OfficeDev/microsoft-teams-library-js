name: Post Release
on:
  pull_request:
    branches: [release/*]
    types: [closed]

jobs:
  CreatePrerelease:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: create-prerelease-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          path: release-candidate
          persist-credentials: false

      - name: Checkout release automation
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-automation
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '18.x'

      - name: Create or update GitHub prerelease
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          node release-automation/tools/cli/create-github-release.js \
            --base-ref "$BASE_REF" \
            --target "$TARGET_SHA" \
            --package-file release-candidate/packages/teams-js/package.json \
            --changelog-file release-candidate/packages/teams-js/CHANGELOG.md

  PostMerge:
    # this job will only run if the PR has been merged
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '18.x'

      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Extract branch name
        id: extract_branch
        run: echo "::set-output name=branch::${GITHUB_REF#refs/heads/}"

      - name: Extract version
        id: extract_version
        run: |
          version=$(echo ${{ steps.extract_branch.outputs.branch }} | cut --complement -d "/" -f 1)
          echo "::set-output name=version::$version"

      - name: Extract changelog for version
        id: extract_changelog
        run: |
          changelog=$(node tools/cli/readChangelog.js ${{steps.extract_version.outputs.version}})
          changelog="${changelog//'%'/'%25'}"
          changelog="${changelog//$'\n'/'%0A'}"
          changelog="${changelog//$'\r'/'%0D'}"
          echo -e "::set-output name=changelog::$changelog"

      - name: Notify TeamsFx Repo
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.TEAMSFX_REPO_ACCESS_TOKEN }}
          repository: OfficeDev/TeamsFx
          event-type: teamsjs-released
          client-payload: '{"version": "${{ steps.extract_version.outputs.version }}"}'
