steps:
  - task: NodeTool@0
    displayName: 'Install Node.js'
    inputs:
      versionSpec: '18.x'

  # Redirect package downloads through the CFS-backed ADO feed to comply with
  # network isolation policy (CFSClean). The .npmrc checked into the repo does
  # not set a registry so that external contributors can use npmjs.org directly.
  - task: PowerShell@2
    displayName: 'Configure CFS-compliant npm registry'
    inputs:
      targetType: inline
      script: |
        $npmrc = Join-Path "$(Build.SourcesDirectory)" ".npmrc"
        Add-Content -Path $npmrc -Value "registry=https://office.pkgs.visualstudio.com/ISS/_packaging/ISS_PublicPackages/npm/registry/"
        Add-Content -Path $npmrc -Value "always-auth=true"

  - task: npmAuthenticate@0
    inputs:
      workingFile: '$(Build.SourcesDirectory)/.npmrc'

  - task: CmdLine@2
    displayName: 'Setup pnpm'
    inputs:
      script: |
        npm install -g pnpm@9.0.6 --globalconfig "$(Build.SourcesDirectory)/.npmrc"
        pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store

  - task: CmdLine@2
    displayName: 'Install repo dependencies'
    inputs:
      script: |
        pnpm install
    env:
      CYPRESS_INSTALL_BINARY: '0'
      NEXT_TELEMETRY_DISABLED: '1'

  - task: CmdLine@2
    displayName: 'Check that changefile was created if needed'
    condition: and( eq(variables['Build.Reason'], 'PullRequest'), not(startsWith(variables['System.PullRequest.SourceBranch'], 'release/')), not(startsWith(variables['System.PullRequest.TargetBranch'], 'release/')) )
    inputs:
      script: 'node enforceBeachball.js'

  - task: CmdLine@2
    displayName: 'node prepBetaRelease.cjs'
    condition: and( eq(variables['Build.SourceBranch'], 'refs/heads/main'), in(variables['Agent.JobStatus'], 'Succeeded', 'SucceededWithIssues'), ne(variables['Build.Reason'], 'PullRequest') )
    inputs:
      script: 'node prepBetaRelease.cjs'
      workingDirectory: '$(System.DefaultWorkingDirectory)\packages\teams-js'

  # Generate nuget.config for the Blazor test app so dotnet restore uses the
  # CFS-backed ADO feed instead of api.nuget.org (CFSClean compliance).
  - task: PowerShell@2
    displayName: 'Generate Blazor nuget.config (CFS feed only)'
    inputs:
      targetType: inline
      script: |
        $configPath = 'apps\blazor-test-app\nuget.config'
        $lines = @(
          '<?xml version="1.0" encoding="utf-8"?>',
          '<configuration>',
          '  <packageSources>',
          '    <clear />',
          '    <add key="CFS-NuGet" value="https://office.pkgs.visualstudio.com/ISS/_packaging/ISS_PublicPackages/nuget/v3/index.json" />',
          '  </packageSources>',
          '</configuration>'
        )
        $lines | Set-Content -Path $configPath
        Write-Host "Generated $configPath"
        Get-Content $configPath

  - task: NuGetAuthenticate@1

  # Clean stale Blazor build artifacts to ensure no cached static web assets
  # (e.g., from previously-referenced FluentUI NuGet package) serve unpkg.com scripts.
  - task: CmdLine@2
    displayName: 'Clean Blazor build artifacts'
    inputs:
      script: |
        dotnet clean apps\blazor-test-app\Blazor-Test-App.csproj
        if exist apps\blazor-test-app\obj rmdir /s /q apps\blazor-test-app\obj
        if exist apps\blazor-test-app\bin rmdir /s /q apps\blazor-test-app\bin

  # Restore NuGet packages as a direct pipeline task so that
  # NuGetAuthenticate@1 credentials are reliably inherited.
  # Running dotnet restore through pnpm/node causes the credential
  # provider plugin to crash (exit code -1) in some agent environments.
  - task: DotNetCoreCLI@2
    displayName: 'Restore Blazor NuGet packages'
    inputs:
      command: 'restore'
      projects: 'apps\blazor-test-app\Blazor-Test-App.csproj'
      feedsToUse: 'config'
      nugetConfigPath: 'apps\blazor-test-app\nuget.config'

  - task: CmdLine@2
    displayName: 'pnpm build'
    inputs:
      script: |
        pnpm build-force-blazor
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SIZE_LIMIT_FAKE_TIME: '1'

  - task: CmdLine@2
    displayName: 'pnpm test'
    inputs:
      script: |
        pnpm test
    env:
      NEXT_TELEMETRY_DISABLED: '1'

  - task: PublishTestResults@2
    inputs:
      searchFolder: '$(System.DefaultWorkingDirectory)\packages'
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/unit-tests-report*.xml'
      testRunTitle: 'Unit Tests'
    condition: succeededOrFailed()

  - task: CmdLine@2
    displayName: 'Run bundle analysis and collect'
    inputs:
      script: |
        pnpm bundleAnalyze:collect

  - task: Bash@3
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    condition: and( in(variables['Agent.JobStatus'], 'Succeeded', 'SucceededWithIssues'), eq(variables['Build.Reason'], 'PullRequest'), eq(variables['System.PullRequest.TargetBranch'], 'main'))
    name: bundleAnalysisTask
    displayName: 'Analyze bundles against main and output result'
    inputs:
      targetType: inline
      script: 'node --max-old-space-size=4096 tools/cli/compareBundleAnalysis.js --commitId=$(System.PullRequest.SourceCommitId) --orgUrl=$(System.CollectionUri) --projectName=$(System.TeamProject) --buildId=$(System.DefinitionId) --bundleArtifactName=$(bundleArtifactName) --baseBranchName=$(System.PullRequest.TargetBranch)'

  - task: PowerShell@2
    name: package
    displayName: 'Set package.version Variable'
    inputs:
      targetType: inline
      script: |
        $npmVer=$(node -p "require('./packages/teams-js/package.json').version")
        Write-Host "##vso[task.setvariable variable=version;isOutput=true]$npmVer"

  - task: CopyFiles@2
    inputs:
      sourceFolder: 'apps/teams-test-app/build'
      contents: '**'
      targetFolder: '$(Build.ArtifactStagingDirectory)\teams-test-app'
    displayName: 'Copy Test app to artifacts staging directory'

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)\teams-test-app'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)\teams-test-app\$(Build.BuildId).zip'
      replaceExistingArchive: true
    displayName: 'Zip Test app artifacts'

  - task: CopyFiles@2
    inputs:
      sourceFolder: 'packages\teams-js\dist\umd'
      contents: '**\?(*.js|*.ts|*.map)'
      targetFolder: '$(Build.ArtifactStagingDirectory)\CDNFeed\$(package.version)\js'
    displayName: 'Copy TeamsJS Content for CDN'

  - task: CopyFiles@2
    inputs:
      Contents: |
        packages\teams-js\src\artifactsForCDN\validDomains.json
      TargetFolder: '$(Build.ArtifactStagingDirectory)\validDomains\json'
      flattenFolders: true
    displayName: 'Copy validDomains for CDN'

  - task: CopyFiles@2
    inputs:
      Contents: |
        packages\teams-js\package.json
        packages\teams-js\README.md
        LICENSE
      TargetFolder: '$(Build.ArtifactStagingDirectory)\NPMFeed'
      flattenFolders: true
    displayName: 'Copy TeamsJS Content for NPM'

  - task: CopyFiles@2
    inputs:
      sourceFolder: 'packages\teams-js\dist'
      contents: '**\?(*.js|*.ts|*.map)'
      TargetFolder: '$(Build.ArtifactStagingDirectory)\NPMFeed\dist'
      flattenFolders: false
    displayName: 'Copy JS Content for NPM'

  - task: CopyFiles@2
    inputs:
      Contents: |
        packages\teams-js\scripts\*.ps1
      TargetFolder: '$(Build.ArtifactStagingDirectory)\scripts'
      flattenFolders: true
    displayName: 'Copy Power Shell scripts to scripts'
