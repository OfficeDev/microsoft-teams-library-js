trigger: none
# The weekly SDF beta queues itself every Wednesday at 18:00 UTC (10:00 PST, 11:00 PDT), within the hours it has been
# queued by hand. Check_Skip decides whether a scheduled run publishes, using tools/releases/sdf-beta-schedule.js from
# the CI build's scripts artifact; manual runs always publish. Both still need the Lockbox approval.
schedules:
  - cron: '0 18 * * 3'
    displayName: Weekly SDF beta
    branches:
      include:
        - main
    always: true
resources:
  repositories:
    - repository: CustomPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release
  pipelines:
    # Without a branch, a scheduled run takes the latest successful run of the CI pipeline on any branch, which can be
    # a release branch build with no beta version. Manual runs can still pick another build.
    - pipeline: microsoft-teams-library-js-pipeline
      source: 'microsoft-teams-library-js/M365 Platform/App SDK/OfficeDev.microsoft-teams-library-js'
      project: ISS
      branch: main
variables:
  - name: System.Debug
    value: true
extends:
  template: v1/Office.Official.PipelineTemplate.yml@CustomPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows
    serviceTreeId: $(serviceTreeId)
    customBuildTags:
      - ES365AIMigrationTooling-Release-MOBR
    stages:
      - stage: Check_Skip
        displayName: Check the weekly beta skip rule
        dependsOn: []
        jobs:
          - job: Check
            displayName: Decide whether this run publishes
            # A release job, so the stage adds no source analysis and the Lockbox stage waits only for this decision.
            # Release jobs cannot check out the repository, so the script comes from the CI build.
            templateContext:
              type: releaseJob
              isProduction: false
              inputs:
                - input: pipelineArtifact
                  pipeline: microsoft-teams-library-js-pipeline
                  artifactName: NPMFeed
                  targetPath: $(Pipeline.Workspace)/NPMFeed
                - input: pipelineArtifact
                  pipeline: microsoft-teams-library-js-pipeline
                  artifactName: scripts
                  targetPath: $(Pipeline.Workspace)/scripts
            steps:
              - task: NodeTool@0
                displayName: Use Node 18.x
                condition: eq(variables['Build.Reason'], 'Schedule')
                inputs:
                  versionSpec: 18.x
              - task: PowerShell@2
                name: Decide
                displayName: Apply the skip rule
                condition: eq(variables['Build.Reason'], 'Schedule')
                inputs:
                  targetType: inline
                  script: >-
                    node '$(Pipeline.Workspace)/scripts/sdf-beta-schedule.js'
                    --reason '$(Build.Reason)'
                    --npm-feed '$(Pipeline.Workspace)/NPMFeed'
                    --alias microsoft-teams-library-js-pipeline
                    --source-branch '$(resources.pipeline.microsoft-teams-library-js-pipeline.sourceBranch)'
                    --run-id '$(resources.pipeline.microsoft-teams-library-js-pipeline.runID)'
                    --run-name '$(resources.pipeline.microsoft-teams-library-js-pipeline.runName)'
                    --commit '$(resources.pipeline.microsoft-teams-library-js-pipeline.sourceCommit)'
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      - stage: Prod_Lockbox_Approval_Deployment
        displayName: Lockbox Approval/Deployment
        dependsOn: Check_Skip
        # Manual runs skip the Decide step and always publish.
        condition: and(succeeded(), or(ne(variables['Build.Reason'], 'Schedule'), eq(dependencies.Check_Skip.outputs['Check.Decide.publish'], 'true')))
        templateContext:
          cloud: Public
          isProduction: false
          approval:
            workflow: lockbox
            scope:
              serviceGroupName: Platform
              subscriptionIds:
                - $(subscriptionId)
        jobs:
          - job: Agent_job
            templateContext:
              type: releaseJob
              workflow: m365-custom
              inputs:
                - input: pipelineArtifact
                  pipeline: microsoft-teams-library-js-pipeline
                  artifactName: NPMFeed
                  targetPath: $(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/NPMFeed
                - input: pipelineArtifact
                  pipeline: microsoft-teams-library-js-pipeline
                  artifactName: CDNFeed
                  targetPath: $(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/CDNFeed
                - input: pipelineArtifact
                  pipeline: microsoft-teams-library-js-pipeline
                  artifactName: scripts
                  targetPath: $(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/scripts

            steps:
              - task: prepare-deployment@1
                displayName: Prepare deployment
                inputs:
                  taskType: credentialFetchTaskAzureRM
                  armserviceconnection: $(serviceConnectionId)
                  subscriptionid: $(subscriptionId)
              - task: AssetRetention@6
                displayName: ARtifact Retention Orchestrator Workflow (ARROW)
                inputs:
                  IsShipped: true
              - task: NodeTool@0
                displayName: Use Node 18.x
                inputs:
                  versionSpec: 18.x
              - task: Npm@1
                displayName: Build NPM package for release
                inputs:
                  command: custom
                  workingDir: $(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/NPMFeed
                  verbose: false
                  customCommand: pack
              - task: EsrpRelease@10
                displayName: Publish to npm (tag beta) - ESRP release
                inputs:
                  connectedservicename: '$(connectedServiceName)'
                  usemanagedidentity: true
                  keyvaultname: '$(keyVaultName)'
                  signcertname: '$(signCertName)'
                  clientid: '$(clientId)'
                  intent: 'PackageDistribution'
                  contenttype: 'npm'
                  contentsource: 'Folder'
                  folderlocation: '$(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/NPMFeed'
                  waitforreleasecompletion: true
                  owners: $(owners)
                  approvers: $(approvers)
                  serviceendpointurl: '$(serviceEndpointUrl)'
                  mainpublisher: '$(mainPublisher)'
                  domaintenantid: '$(domainTenantId)'
                  productstate: 'Beta'
              - task: M365CdnAssetsUpload@3
                displayName: Push teams-js to M365 1CDN (SDF)
                inputs:
                  SourcePath: $(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/CDNFeed/*
                  ConnectedServiceNameARM: $(serviceConnectionId)
                  Environment: PublicCloudSDF
                  ContainerName: teams-js
                  AdditionalArgumentsForBlobCopy: --overwrite=false --log-level=INFO --recursive
              - task: PowerShell@2
                displayName: View Published Package URLs
                inputs:
                  targetType: 'filePath'
                  filePath: 'microsoft-teams-library-js-pipeline/scripts/view-published-packages-urls.ps1'
                  arguments: -PIPELINE_WORKSPACE $(System.DefaultWorkingDirectory)
