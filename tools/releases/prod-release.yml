trigger: none
resources:
  repositories:
    - repository: CustomPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/OfficePipelineTemplates
      ref: refs/tags/release
  pipelines:
    - pipeline: microsoft-teams-library-js-pipeline
      source: 'microsoft-teams-library-js/M365 Platform/App SDK/OfficeDev.microsoft-teams-library-js'
      project: ISS
extends:
  template: v1/Office.Official.PipelineTemplate.yml@CustomPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows
    serviceTreeId: $(serviceTreeId)
    # The validation job checks out the source, so the template scans it; configure ESLint as build-release.yml does.
    sdl:
      eslint:
        configuration: 'required'
        parser: '@typescript-eslint/parser'
        parserOptions: 'ecmaFeatures:{jsx:true}\necmaVersion:12\nsourceType:module\nproject:$(Build.SourcesDirectory)/tsconfig.common.json'
        enableExclusions: true
        exclusionPatterns": "*.d.ts\n*.spec.js\n*.spec.jsx\n*.spec.ts\n*.spec.tsx\n*.test.ts\n*.test.tsx"
        customEnvironments: true
        environmentsBrowser: true
        environmentsNode: true
        environmentsCommonJs: true
        environmentsSharedNodeBrowser: false
        environmentsEs6: false
        environmentsEs2017: false
        environmentsEs2020: true
        environmentsJest: false
    customBuildTags:
      - ES365AIMigrationTooling-Release-MOBR
    stages:
      # Runs before the Lockbox request: fails fast if the pinned CI build is not the one for this branch.
      - stage: Prod_Validation
        displayName: Validate the pinned CI build
        dependsOn: []
        jobs:
          - job: Validate_CI_build
            displayName: Check the CI build against the release branch
            templateContext:
              inputs:
                - input: pipelineArtifact
                  pipeline: microsoft-teams-library-js-pipeline
                  artifactName: CDNFeed
                  targetPath: $(Pipeline.Workspace)/microsoft-teams-library-js-pipeline/CDNFeed
                - input: pipelineArtifact
                  pipeline: microsoft-teams-library-js-pipeline
                  artifactName: NPMFeed
                  targetPath: $(Pipeline.Workspace)/microsoft-teams-library-js-pipeline/NPMFeed
            steps:
              - checkout: self
              - task: NodeTool@0
                displayName: Use Node 18.x
                inputs:
                  versionSpec: 18.x
              - task: PowerShell@2
                displayName: Check the pinned CI build
                inputs:
                  targetType: 'filePath'
                  filePath: 'tools/releases/powershell-commands/validate-prod-build.ps1'
                  arguments: >-
                    -CDNFeed '$(Pipeline.Workspace)/microsoft-teams-library-js-pipeline/CDNFeed'
                    -NPMFeed '$(Pipeline.Workspace)/microsoft-teams-library-js-pipeline/NPMFeed'
                    -CISourceBranch '$(resources.pipeline.microsoft-teams-library-js-pipeline.sourceBranch)'
                    -CISourceCommit '$(resources.pipeline.microsoft-teams-library-js-pipeline.sourceCommit)'
                    -QueuedBranch '$(Build.SourceBranch)'
                    -QueuedCommit '$(Build.SourceVersion)'
      - stage: Prod_Lockbox_Approval_Deployment
        displayName: Lockbox Approval/Deployment
        dependsOn:
          - Prod_Validation
        templateContext:
          cloud: Public
          isProduction: true
          approval:
            workflow: lockbox
            scope:
              serviceGroupName: Platform
              subscriptionIds:
                - $(subscriptionId)
        jobs:
          - job: Agent_job
            condition: or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))
            templateContext:
              type: releaseJob
              workflow: m365-custom
              inputs:
                - input: pipelineArtifact
                  pipeline: microsoft-teams-library-js-pipeline
                  artifactName: NPMFeed
                  targetPath: $(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/NPMFeed
                - input: pipelineArtifact
                  pipeline: microsoft-teams-library-js-pipeline
                  artifactName: CDNFeed
                  targetPath: $(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/CDNFeed
                - input: pipelineArtifact
                  pipeline: microsoft-teams-library-js-pipeline
                  artifactName: scripts
                  targetPath: $(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/scripts
            steps:
              - task: prepare-deployment@1
                displayName: Prepare deployment
                inputs:
                  taskType: credentialFetchTaskAzureRM
                  armserviceconnection: $(serviceConnectionId)
                  subscriptionid: $(subscriptionId)
              - task: AssetRetention@6
                displayName: ARtifact Retention Orchestrator Workflow (ARROW)
                inputs:
                  IsShipped: true
              - task: NodeTool@0
                displayName: Use Node 18.x
                inputs:
                  versionSpec: 18.x
              - task: Npm@1
                displayName: Build NPM package for release
                inputs:
                  command: custom
                  workingDir: $(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/NPMFeed
                  verbose: false
                  customCommand: pack
              - task: EsrpRelease@10
                displayName: Publish to npm (tag latest) - ESRP release
                inputs:
                  connectedservicename: '$(connectedServiceName)'
                  usemanagedidentity: true
                  keyvaultname: '$(keyVaultName)'
                  signcertname: '$(signCertName)'
                  clientid: '$(clientId)'
                  intent: 'PackageDistribution'
                  contenttype: 'npm'
                  contentsource: 'Folder'
                  folderlocation: '$(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/NPMFeed'
                  waitforreleasecompletion: true
                  owners: $(owners)
                  approvers: $(approvers)
                  serviceendpointurl: '$(serviceEndpointUrl)'
                  mainpublisher: '$(mainPublisher)'
                  domaintenantid: '$(domainTenantId)'
                  productstate: 'Latest'
              - task: M365CdnAssetsUpload@3
                displayName: Push teams-js to M365 1CDN (Prod)
                inputs:
                  SourcePath: $(System.DefaultWorkingDirectory)/microsoft-teams-library-js-pipeline/CDNFeed/*
                  ConnectedServiceNameARM: $(serviceConnectionId)
                  ContainerName: teams-js
                  AdditionalArgumentsForBlobCopy: --overwrite=false --log-level=INFO --recursive
              - task: PowerShell@2
                displayName: View Published Package URLs
                inputs:
                  targetType: 'filePath'
                  filePath: 'microsoft-teams-library-js-pipeline/scripts/view-published-packages-urls.ps1'
                  arguments: -PIPELINE_WORKSPACE $(System.DefaultWorkingDirectory)
